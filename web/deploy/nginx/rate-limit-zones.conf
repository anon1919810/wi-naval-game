# Plimsoll rate-limit zones (http context).
#
# Optional: install with
#   sudo cp web/deploy/nginx/rate-limit-zones.conf /etc/nginx/conf.d/plimsoll-rate-limit-zones.conf
# and uncomment the matching include + limit_req lines in plimsoll.conf.template.
# These are coarse transport limits only; the real anonymous-workspace limit is the
# application's 30 requests/hour counter, which this file cannot replace.

limit_req_zone $binary_remote_addr zone=plimsoll_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=plimsoll_bootstrap:10m rate=1r/s;
