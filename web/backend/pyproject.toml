[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plimsoll-web"
version = "0.1.0"
description = "Private web workspace for the Plimsoll calculation core"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3,<4",
  "uvicorn>=0.30,<1",
  "email-validator>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plimsoll_web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
